name: index-listing
on:
  workflow_dispatch:
    inputs:
      mode: {description: "full or update", default: "update"}
  schedule:
    - cron: "17 */2 * * *"   # new uploads (and any unfinished full walk): every 2 hours
permissions:
  contents: write
concurrency: {group: data-main, cancel-in-progress: false}
jobs:
  index:
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q requests
      - run: python scripts/index.py ${{ inputs.mode || 'update' }} 95
        timeout-minutes: 105
      - if: always()
        run: python extract/terminal.py ALL data/terminal.json || true
      - name: Commit
        if: always()
        run: |
          git config user.name ocr-bot; git config user.email ocr-bot@users.noreply.github.com
          git add -A data
          git diff --cached --quiet && exit 0
          git commit -qm "Listing index update"
          for i in 1 2 3 4 5; do git pull -q --rebase origin main && git push -q origin HEAD:main && break; sleep $((i*7)); done
