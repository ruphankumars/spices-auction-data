name: index-listing
on:
  workflow_dispatch:
    inputs:
      mode: {description: "full or update", default: "update"}
  schedule:
    - cron: "17 */2 * * *"   # new uploads (and any unfinished full walk): every 2 hours
permissions:
  contents: write
  actions: write
concurrency: {group: data-main, cancel-in-progress: false}
jobs:
  index:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q requests
      - run: python scripts/index.py ${{ inputs.mode || 'update' }} 95
        timeout-minutes: 105
      - name: Commit
        if: always()
        run: bash scripts/push_paths.sh "Listing index update" data/index.json data/index_partial.json
      - name: Carry on (scheduled runs are not firing, so each run starts the next)
        if: always()
        env: {GH_TOKEN: "${{ github.token }}"}
        run: |
          git fetch -q origin main && git reset -q --hard origin/main
          gh workflow run schedule.yml || true
          if [ -f data/index_partial.json ]; then gh workflow run index.yml -f mode=full; gh workflow run backlog.yml; echo "next listing run and a backlog round started";
          elif [ -f data/index.json ]; then gh workflow run backlog.yml; echo "backlog started"; fi
