name: debug-ocr
# One-off: OCR the given reports (all passes) and push the text, not the PDFs, to a branch for study.
on:
  workflow_dispatch:
    inputs:
      chunks: {description: "JSON list of comma-separated report numbers, one per job", required: true}
permissions:
  contents: write
jobs:
  ocr:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        ns: ${{ fromJson(inputs.chunks) }}
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils tesseract-ocr imagemagick
      - run: pip install -q requests rapidocr-onnxruntime opencv-python-headless numpy
      - run: |
          python scripts/fetch_index.py "${{ matrix.ns }}"
          for p in base:ocr_batch multi:ocr_multi var:ocr_variants; do n=${p%%:*}; s=${p##*:}; rm -rf work/out; bash scripts/$s.sh > outs_$n.log 2>&1 || true; mkdir -p dbg; mv work/out dbg/$n 2>/dev/null || true; done
          cp work/manifest.json dbg/; find dbg -name '*.pdf' -delete; find dbg -name '*.png' -delete; find dbg -name '*.ppm' -delete
          B="debug/$(echo '${{ matrix.ns }}' | tr ',' '-')"
          git config user.name ocr-bot; git config user.email ocr-bot@users.noreply.github.com
          git checkout -q --orphan "$B"; git rm -rq --cached . ; git add -f dbg; git commit -qm "debug ${{ matrix.ns }}"; git push -q -f origin "$B"
