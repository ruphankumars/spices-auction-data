name: fetch-ocr-batch
on:
  workflow_dispatch:
    inputs:
      start: {description: "First listing row (1 = newest)", default: "1"}
      end: {description: "Last listing row", default: "14"}
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils tesseract-ocr imagemagick
      - run: pip install -q requests
      - run: python scripts/fetch_batch.py ${{ inputs.start }} ${{ inputs.end }}
      - run: bash scripts/ocr_batch.sh
      - uses: actions/upload-artifact@v4
        with:
          name: batch-${{ inputs.start }}-${{ inputs.end }}
          path: |
            work/manifest.json
            work/listing_p*.html
            work/out/
          retention-days: 3
