name: backlog
# Reads the reports not read yet, newest first, in parallel chunks; then rebuilds
# data/terminal.json (what the Emperor Cardamom app shows, with the progress bar).
on:
  workflow_dispatch:
    inputs:
      jobs: {description: "parallel jobs", default: "18"}
      per_job: {description: "reports per job", default: "4"}
  schedule:
    - cron: "5,35 * * * *"
permissions:
  contents: write
concurrency: {group: backlog, cancel-in-progress: false}
jobs:
  plan:
    # Runs only once the repository is public (free minutes); private = nothing happens.
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.p.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: p
        run: |
          [ -f data/index.json ] || { echo 'matrix={"include":[]}' >> "$GITHUB_OUTPUT"; exit 0; }
          echo "matrix=$(python scripts/plan.py ${{ inputs.jobs || '18' }} ${{ inputs.per_job || '4' }})" >> "$GITHUB_OUTPUT"
  read:
    needs: plan
    if: needs.plan.outputs.matrix != '{"include":[]}'
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      max-parallel: 18
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils tesseract-ocr imagemagick
      - run: pip install -q requests rapidocr-onnxruntime opencv-python-headless numpy
      - run: bash scripts/run_chunk.sh "${{ matrix.ns }}"
      - name: Commit this chunk
        run: |
          git config user.name ocr-bot; git config user.email ocr-bot@users.noreply.github.com
          git add data/batches
          git diff --cached --quiet && exit 0
          git commit -qm "Reports ${{ matrix.ns }}"
          for i in 1 2 3 4 5 6 7 8; do git pull -q --rebase origin main && git push -q origin HEAD:main && break; sleep $((i*5 + RANDOM % 9)); done
  publish:
    needs: [plan, read]
    if: always() && needs.plan.outputs.matrix != '{"include":[]}'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - run: git pull -q origin main && python extract/terminal.py ALL data/terminal.json
      - name: Load new batches into Supabase (skips until the secrets exist)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: pip install -q requests && python scripts/load_supabase.py
      - run: |
          git config user.name ocr-bot; git config user.email ocr-bot@users.noreply.github.com
          git add data/terminal.json
          git diff --cached --quiet && exit 0
          git commit -qm "Terminal snapshot: $(python -c 'import json;s=json.load(open("data/terminal.json"))["status"];print(s["done"],"of",s["listed"])')"
          for i in 1 2 3 4 5; do git pull -q --rebase origin main && git push -q origin HEAD:main && break; sleep $((i*7)); done
