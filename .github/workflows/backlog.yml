name: backlog
# Reads the reports not read yet, newest first, in parallel chunks; then rebuilds
# data/terminal.json (what the Emperor Cardamom app shows, with the progress bar).
on:
  workflow_dispatch:
    inputs:
      jobs: {description: "parallel jobs", default: "18"}
      per_job: {description: "reports per job", default: "4"}
  schedule:
    - cron: "5,35 * * * *"
permissions:
  contents: write
  actions: write
concurrency: {group: backlog, cancel-in-progress: false}
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.p.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: p
        run: |
          [ -f data/index.json ] || [ -f data/index_partial.json ] || { echo 'matrix={"include":[]}' >> "$GITHUB_OUTPUT"; exit 0; }
          echo "matrix=$(python scripts/plan.py ${{ inputs.jobs || '18' }} ${{ inputs.per_job || '4' }})" >> "$GITHUB_OUTPUT"
  read:
    needs: plan
    if: needs.plan.outputs.matrix != '{"include":[]}'
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      max-parallel: 18
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils tesseract-ocr imagemagick
      - run: pip install -q requests rapidocr-onnxruntime opencv-python-headless numpy
      - run: bash scripts/run_chunk.sh "${{ matrix.ns }}"
      - name: Commit this chunk
        run: bash scripts/push_paths.sh "Reports ${{ matrix.ns }}" data/batches
  publish:
    needs: [plan, read]
    if: always() && needs.plan.outputs.matrix != '{"include":[]}'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - run: python extract/terminal.py ALL data/terminal.json
      - name: Load new batches into Supabase (skips until the secrets exist)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: pip install -q requests && python scripts/load_supabase.py
      - run: bash scripts/push_paths.sh "Terminal snapshot" data/terminal.json data/lots.json
      - name: Next round while reports are pending
        env: {GH_TOKEN: "${{ github.token }}"}
        run: |
          git fetch -q origin main && git reset -q --hard origin/main
          P=$(python scripts/plan.py 1 1 2>&1 >/dev/null | awk '{print $2}')
          echo "pending: $P"
          if [ "${P:-0}" -gt 0 ]; then gh workflow run backlog.yml; fi
