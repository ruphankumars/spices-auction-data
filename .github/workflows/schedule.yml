name: schedule-text
# The text of the board's e-auction schedule circulars, read for the Cardamom server (schedule/*.txt).
on:
  workflow_dispatch:
  schedule:
    - cron: "40 */3 * * *"
permissions:
  contents: write
concurrency: {group: schedule-text, cancel-in-progress: false}
jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils tesseract-ocr && pip install -q requests
      - run: python scripts/schedule_text.py
      - run: bash scripts/push_paths.sh "Schedule circular text" schedule
