# Render Blueprint: the auction-report pipeline as an hourly cron job (replaces the
# GitHub Actions workflows, which are switched off). Runs back to back while reports
# are pending, a few minutes an hour after that. Results go to Supabase.
services:
  - type: cron
    name: auction-pipeline
    runtime: docker
    dockerfilePath: ./Dockerfile
    schedule: "0 * * * *"
    plan: pro plus         # 4 CPU / 8 GB while the backlog runs; "standard" after it is done
    region: singapore
    envVars:
      - key: JOBS             # two batches side by side (4 CPU / 8 GB)
        value: "2"
      - key: SUPABASE_URL
        value: https://gddgrokdoxbjamtninyw.supabase.co
      - key: SUPABASE_SERVICE_KEY
        sync: false        # entered in the Render dashboard, never in the repository

