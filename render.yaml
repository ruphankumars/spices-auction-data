# Render Blueprint: the auction-report pipeline as an hourly cron job (replaces the
# GitHub Actions workflows, which are switched off). Runs back to back while reports
# are pending, a few minutes an hour after that. Results go to Supabase.
services:
  - type: cron
    name: auction-pipeline
    runtime: docker
    dockerfilePath: ./Dockerfile
    schedule: "0 * * * *"
    plan: pro max          # 4 CPU / 16 GB while the backlog runs; "standard" after it is done
    region: singapore
    envVars:
      - key: SUPABASE_URL
        value: https://gddgrokdoxbjamtninyw.supabase.co
      - key: SUPABASE_SERVICE_KEY
        sync: false        # entered in the Render dashboard, never in the repository

  # The nightly intelligence (names, signals, models) from the private auction-intel repo.
  - type: cron
    name: auction-intel
    repo: https://github.com/ruphankumars/auction-intel
    runtime: python
    buildCommand: "true"
    startCommand: python run.py
    schedule: "40 1 * * *"   # 07:10 IST, after the morning's pipeline runs
    plan: starter
    region: singapore
    envVars:
      - key: SUPABASE_URL
        value: https://gddgrokdoxbjamtninyw.supabase.co
      - key: SUPABASE_SERVICE_KEY
        sync: false
